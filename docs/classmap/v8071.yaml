# ============================================================================
# classmap v8071 — 微信 8.0.71 混淆类名/成员「人看的对照字典」
# ============================================================================
# 用途：把代码里硬编码的微信混淆符号（如 kc5.v0 / pz0.h）↔ 它到底是干嘛的
#       记下来。8.0.72 升级时只改本文件 + 跑 tools/check_classmap.ps1 即可定位
#       哪些硬编码还没同步。
#
# 这不是加密文件，是明文对照表。加密化是 P28（v2）的事，与本文件无关。
#
# 字段说明：
#   name    : 代码里硬编码的字面量（混淆类名 / 方法名 / 字段名），校验脚本按此 grep
#   kind    : class | member（member = 方法名/字段名字面量，挂在 owner 上）
#   owner   : 仅 member 用，标明属于哪个类（混淆名）
#   desc    : 这个符号是干嘛的（中文，人看的）
#   feature : 关联功能 / 权威文档锚点（§ 指 docs/HOOK_MAP_8071_AUTHORITATIVE.md）
#   refs    : 代码引用文件（相对 src/main/java/com/ghost/assist/），校验脚本核对
#   status  : ok | deprecated（deprecated = 已证伪/废弃，仅留考古，脚本不报缺失）
#
# 维护铁律：
#   - 只登记「代码里真的硬编码了」的符号，禁止凭空补 8.0.66/8.0.70 的名字。
#   - 改本文件前后必跑 check_classmap.ps1，保证字典 ↔ 代码不漂。
# ----------------------------------------------------------------------------

