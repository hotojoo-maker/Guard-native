// Guard Native — LSPosed Module
// Target: WeChat 8.0.71 / minSdk 27 (Android 8.1) / compileSdk 34
//
// Dependencies that need manual setup before first build:
//   1. XposedBridge API: place xposed-api-82.jar in app/libs/
//      or use compileOnly from the maven repo below.
//   2. MMKV: add AAR to app/libs/ or enable the implementation line below.
//      Download: https://github.com/Tencent/MMKV/releases
//
// Build:  ./gradlew assembleDebug
// Install: adb install -r app/build/outputs/apk/debug/*.apk

plugins {
    id 'com.android.application' version '8.2.2' apply true
}

// ── Canary 基线构建期自动计算（单一真源 = PromoConfig.java）────────────
// 蜜罐绊线 CompatProbe 比对「诱饵真值指纹」与编译期基线。过去基线是手写常量
// (CompatProbe.BASELINE=0xF3C1CAB3)，改诱饵忘重算 → 正版自我误判篡改（场景B 误伤）。
// 现改为构建期从 PromoConfig 真值算出并注入 BuildConfig.CANARY_BASELINE：改诱饵
// 重编 → 基线自动跟随，从根上消除「忘重算」误伤。
// ⚠️ guardCanaryFp 必须与 CompatProbe.fp 逐位一致（Java int：h = h*131 + c，32 位回绕）。
int guardCanaryFp(String s) {
    long h = 0
    for (int i = 0; i < s.length(); i++) {
        h = (h * 131L + (long) (int) s.charAt(i)) & 0xFFFFFFFFL
    }
    return (int) h
}

int computeCanaryBaseline() {
    // KAT：固定输入 → 期望输出，证 gradle fp 未漂移（有人改坏 fp → 正版全误判，
    // 此处当场 build 失败，不用等装机）。期望值由 tools 同算法预算（hex 0x9009DA99）。
    int kat = guardCanaryFp("guard_canary_kat_v1")
    if (kat != (int) 0x9009DA99L) {
        throw new GradleException("[canary] fp KAT failed: got 0x" +
                Integer.toHexString(kat) + " expected 0x9009DA99 — gradle fp drifted")
    }
    File f = file("src/main/java/com/ghost/assist/core/PromoConfig.java")
    if (!f.exists()) {
        throw new GradleException("[canary] PromoConfig.java not found: " + f)
    }
    String src = f.text
    def mUrl = (src =~ /PROMO_URL\s*=\s*"([^"]*)"/)
    def mTok = (src =~ /PROMO_TOKEN\s*=\s*"([^"]*)"/)
    def mEn = (src =~ /PROMO_ENABLED\s*=\s*(true|false)/)
    if (!mUrl.find() || !mTok.find() || !mEn.find()) {
        throw new GradleException("[canary] failed to parse PROMO_* from PromoConfig.java")
    }
    int gr = (int) 0x9E3779B9L
    int baseline = guardCanaryFp(mUrl.group(1)) ^ guardCanaryFp(mTok.group(1)) ^
            (mEn.group(1) == "true" ? gr : 0)
    println "[canary] baseline=0x" + Integer.toHexString(baseline) + " (auto from PromoConfig)"
    return baseline
}

android {
    namespace 'com.ghost.assist'
    compileSdk 34

    defaultConfig {
        applicationId "com.ghost.assist"
        minSdk 27           // Android 8.1 — Xiaomi 9 (MI 9) minimum
        targetSdk 34
        versionCode 14
        versionName "1.6"

        buildConfigField "String", "GUARD_PRODUCT_VERSION", "\"v1.6\""

        // Canary 基线：构建期从 PromoConfig 单一真源自动算（见文件顶部 computeCanaryBaseline）。
        // CompatProbe 运行时读 BuildConfig.CANARY_BASELINE，改诱饵重编自动跟随，杜绝忘重算误伤。
        buildConfigField "int", "CANARY_BASELINE", "${computeCanaryBaseline()}"

        // ── libguardcore.so ───────────────────────────────────
        // Build for arm64-v8a (Xiaomi 9 primary) + armeabi-v7a (32-bit compat).
        // x86/x86_64 omitted — we target physical devices only.
        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a", "armeabi-v7a"
                // Debug-only native macros (GUARD_DEV_LOG / GUARD_DEV_SELFTEST) are
                // defined in native_core/CMakeLists.txt via CMAKE_BUILD_TYPE — NOT
                // via cppFlags here (the old buildTypes{debug/release} block was
                // ineffective and leaked -DGUARD_DEBUG into release SO).
            }
        }
    }

    // ── Signing truth (2026-06-29) ──
    // debug 变体当前签 CA421... debug key（signingReport 为准），只用于模块/公告/C2 smoke；
    // release 变体按 flavor 各自正式 keystore（官替 e3e13a49 / 共存 8f47a47a）。
    // signingConfigs 必须在 productFlavors 之前声明（flavor 要引用它们）。
    def keystorePropsFile = rootProject.file("signing/keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        // Fixed project-local debug key. Do not fall back to ~/.android/debug.keystore:
        // Gradle may regenerate it on a new machine, changing the package signature.
        guardFixed {
            storeFile file("signing/guard-native-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // 官替 release 正式签名（值来自 signing/keystore.properties，未提交 git）。
        guardOfficialRelease {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps.getProperty("guardOfficialStoreFile"))
                storePassword keystoreProps.getProperty("guardOfficialStorePassword")
                keyAlias keystoreProps.getProperty("guardOfficialKeyAlias")
                keyPassword keystoreProps.getProperty("guardOfficialKeyPassword")
            }
        }
        // 共存 release 正式签名 — 独立 keystore（Q2 各一把）。
        // ⚠ 此处仅“签名”就绪：registry_cipher.inc 当前按 official cert 生成，
        //   coexist 运行时仍会 scatter；coexist 发版前须按其 cert 单独生成 per-flavor registry。
        guardCoexistRelease {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps.getProperty("guardCoexistStoreFile"))
                storePassword keystoreProps.getProperty("guardCoexistStorePassword")
                keyAlias keystoreProps.getProperty("guardCoexistKeyAlias")
                keyPassword keystoreProps.getProperty("guardCoexistKeyPassword")
            }
        }
    }

    flavorDimensions "releaseLine"
    productFlavors {
        official {
            dimension "releaseLine"
            signingConfig signingConfigs.guardOfficialRelease   // 官替 release 正式 key（e3e13a49）；debug 仍以 signingReport 为准
            // 预期签名证书 SHA-256（官替）—— CompatProbe 读 BuildConfig.GUARD_EXPECTED_CERT。
            // 三端同步红线：必须 == kdf_common.CERT_SHA256 == 实际 official keystore 证书。
            buildConfigField "String", "GUARD_EXPECTED_CERT", "\"e3e13a4974fe4c40432a583b11309edb4705c8a50b03f474d6b693817adecf36\""
            buildConfigField "String", "GUARD_WX_PKG", "\"com.tencent.mm\""
            buildConfigField "String", "GUARD_RELEASE_ID", "\"android_8071\""
            externalNativeBuild {
                cmake {
                    arguments "-DGUARD_WX_PKG=com.tencent.mm"
                }
            }
        }
        coexist {
            dimension "releaseLine"
            signingConfig signingConfigs.guardCoexistRelease    // 共存 release 正式 key（8f47a47a）；debug 仍以 signingReport 为准
            // 预期签名证书 SHA-256（共存）—— 独立 keystore 的证书。
            // ⚠ registry_cipher.inc 当前仍按 official cert 生成，coexist 运行时 registry 会 scatter；
            //   coexist 发版前须按此 cert 生成 per-flavor registry（见 tools/kdf_common.py + gen_registry_cipher.py）。
            buildConfigField "String", "GUARD_EXPECTED_CERT", "\"8f47a47afde078c47713db78668e6ed9ab027bc9b86d58a9e646a1f3998d5685\""
            buildConfigField "String", "GUARD_WX_PKG", "\"com.tencent.mn\""
            // 共存发行线 ID = android_8071_coexist（设计稿 + 服务器既有线；SSOT 口径 v1）。
            // 服务器 release_lines 已登记 android_8071_coexist，须配 S_rel/W/registry_cipher/卡密同源；
            // 换 cert/registry 后两版各自重生成、装机 recipeOk=true（docs/RELEASE_LINE_SSOT_发行线统一口径.md）。
            buildConfigField "String", "GUARD_RELEASE_ID", "\"android_8071_coexist\""
            externalNativeBuild {
                cmake {
                    arguments "-DGUARD_WX_PKG=com.tencent.mn"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "native_core/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            // AGP debug 变体当前走 debug signing（signingReport = ca421ec3），不等于 release 正式签名。
            // 因 BuildConfig.GUARD_EXPECTED_CERT 仍按发行线正式 cert 注入，debug 包会触发 cert mismatch/scatter；
            // debug 只用于模块更新、公告、C2/心跳 smoke，不作为 release/recipeOk 候选。
            minifyEnabled false
            debuggable true
        }
        release {
            // signingConfig 由 flavor 决定：official→guardOfficialRelease, coexist→guardCoexistRelease。
            minifyEnabled true
            shrinkResources false   // keep xposed_init asset
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Sources live in src/ at the project root (not inside an app/ sub-module)
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs     = ['src/main/java']
            assets.srcDirs   = ['src/main/assets']
            res.srcDirs      = ['src/main/res']
        }
        official {
            res.srcDirs      = ['src/official/res']
        }
        coexist {
            res.srcDirs      = ['src/coexist/res']
        }
        // C5a 归一: build-time-generated RegistryFallback (single source =
        // native_core/registry_8071.json via tools/gen_registry_fallback.py).
        // debug = real literals, release = "" stubs. AGP maps these by
        // convention; declared explicitly (additive) for clarity/determinism.
        debug {
            java.srcDirs += ['src/debug/java']
        }
        release {
            java.srcDirs += ['src/release/java']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // BuildConfig.DEBUG used to gate the debug HTTP dashboard off in release builds.
    buildFeatures {
        buildConfig true
    }

    // A2 anti-ban gate pure-logic JUnit lives in src/test/ (never packaged).
    // returnDefaultValues guards class-load against android.* stubs throwing.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // XposedBridge — compileOnly, provided at runtime by LSPosed framework
    compileOnly fileTree(dir: 'app/libs', include: ['xposed-api-*.jar'])
    // Fallback: maven mirror (uncomment if jar not in app/libs/)
    // compileOnly 'de.robv.android.xposed:api:82'

    // MMKV
    implementation 'com.tencent:mmkv:1.3.5'

    // Ed25519 envelope signature verify (S4). Pure-Java, works on minSdk 27
    // (java.security Ed25519 needs API 33+). Tiny (~80KB), verify-only — the
    // client holds only the server's public key.
    implementation 'net.i2p.crypto:eddsa:0.3.0'

    // Unit test only (testImplementation → not in any APK variant).
    testImplementation 'junit:junit:4.13.2'

    // RecyclerView compileOnly removed: WeChat ProGuards the class name,
    // causing NoClassDefFoundError at runtime. Use pure reflection instead.
}
