// Guard Native — LSPosed Module
// Target: WeChat 8.0.71 / minSdk 27 (Android 8.1) / compileSdk 34
//
// Dependencies that need manual setup before first build:
//   1. XposedBridge API: place xposed-api-82.jar in app/libs/
//      or use compileOnly from the maven repo below.
//   2. MMKV: add AAR to app/libs/ or enable the implementation line below.
//      Download: https://github.com/Tencent/MMKV/releases
//
// Build:  ./gradlew assembleDebug
// Install: adb install -r app/build/outputs/apk/debug/*.apk

plugins {
    id 'com.android.application' version '8.2.2' apply true
}

android {
    namespace 'com.ghost.assist'
    compileSdk 34

    defaultConfig {
        applicationId "com.ghost.assist"
        minSdk 27           // Android 8.1 — Xiaomi 9 (MI 9) minimum
        targetSdk 34
        versionCode 13
        versionName "1.3"

        buildConfigField "String", "GUARD_PRODUCT_VERSION", "\"v1.3\""

        // ── libguardcore.so ───────────────────────────────────
        // Build for arm64-v8a (Xiaomi 9 primary) + armeabi-v7a (32-bit compat).
        // x86/x86_64 omitted — we target physical devices only.
        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a", "armeabi-v7a"
                // Debug-only native macros (GUARD_DEV_LOG / GUARD_DEV_SELFTEST) are
                // defined in native_core/CMakeLists.txt via CMAKE_BUILD_TYPE — NOT
                // via cppFlags here (the old buildTypes{debug/release} block was
                // ineffective and leaked -DGUARD_DEBUG into release SO).
            }
        }
    }

    flavorDimensions "releaseLine"
    productFlavors {
        official {
            dimension "releaseLine"
            buildConfigField "String", "GUARD_WX_PKG", "\"com.tencent.mm\""
            externalNativeBuild {
                cmake {
                    arguments "-DGUARD_WX_PKG=com.tencent.mm"
                }
            }
        }
        coexist {
            dimension "releaseLine"
            buildConfigField "String", "GUARD_WX_PKG", "\"com.tencent.mn\""
            externalNativeBuild {
                cmake {
                    arguments "-DGUARD_WX_PKG=com.tencent.mn"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "native_core/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        // Fixed project-local key. Do not fall back to ~/.android/debug.keystore:
        // Gradle may regenerate it on a new machine, changing the package signature.
        guardFixed {
            storeFile file("signing/guard-native-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.guardFixed
            minifyEnabled false
            debuggable true
        }
        release {
            signingConfig signingConfigs.guardFixed
            minifyEnabled true
            shrinkResources false   // keep xposed_init asset
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Sources live in src/ at the project root (not inside an app/ sub-module)
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs     = ['src/main/java']
            assets.srcDirs   = ['src/main/assets']
            res.srcDirs      = ['src/main/res']
        }
        official {
            res.srcDirs      = ['src/official/res']
        }
        coexist {
            res.srcDirs      = ['src/coexist/res']
        }
        // C5a 归一: build-time-generated RegistryFallback (single source =
        // native_core/registry_8071.json via tools/gen_registry_fallback.py).
        // debug = real literals, release = "" stubs. AGP maps these by
        // convention; declared explicitly (additive) for clarity/determinism.
        debug {
            java.srcDirs += ['src/debug/java']
        }
        release {
            java.srcDirs += ['src/release/java']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // BuildConfig.DEBUG used to gate the debug HTTP dashboard off in release builds.
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // XposedBridge — compileOnly, provided at runtime by LSPosed framework
    compileOnly fileTree(dir: 'app/libs', include: ['xposed-api-*.jar'])
    // Fallback: maven mirror (uncomment if jar not in app/libs/)
    // compileOnly 'de.robv.android.xposed:api:82'

    // MMKV
    implementation 'com.tencent:mmkv:1.3.5'

    // Ed25519 envelope signature verify (S4). Pure-Java, works on minSdk 27
    // (java.security Ed25519 needs API 33+). Tiny (~80KB), verify-only — the
    // client holds only the server's public key.
    implementation 'net.i2p.crypto:eddsa:0.3.0'

    // RecyclerView compileOnly removed: WeChat ProGuards the class name,
    // causing NoClassDefFoundError at runtime. Use pure reflection instead.
}
